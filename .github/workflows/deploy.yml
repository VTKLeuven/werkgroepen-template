name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which server to deploy to
        type: choice
        default: all
        options:
          - all
          - best
          - chemix

permissions:
  contents: read

jobs:
  # The list of servers lives here, in one place. The job exists because a matrix
  # cannot be filtered by a workflow input on its own: `matrix` is not available in
  # a job level `if`, so a condition there would silently skip every server.
  targets:
    name: select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select targets
        id: select
        env:
          # Add a site here, and add its name to the workflow_dispatch options
          # above so it can also be deployed on its own. Only add it once the
          # runner with the matching label is online: until then its job sits
          # queued on every push.
          #
          #   runner      label of the self hosted runner on the host VM. Both
          #               sites share one server, so both use the same label and
          #               their deploys queue behind each other.
          #   project     COMPOSE_PROJECT_NAME. MUST be unique per site: both
          #               deploy directories are called werkgroepen_template, so
          #               without this Compose would give the two sites the same
          #               containers and the same volumes.
          #   deploy_dir  absolute path of the git checkout on that VM
          #   health_url  the host port from APP_PORT in that site's .env
          TARGETS: |
            [
              { "name": "best",
                "runner": "vtk",
                "project": "best",
                "deploy_dir": "/home/it/best/werkgroepen_template",
                "health_url": "http://localhost:8083/" },
              { "name": "chemix",
                "runner": "vtk",
                "project": "chemix",
                "deploy_dir": "/home/it/chemix/werkgroepen_template",
                "health_url": "http://localhost:8082/" }
            ]
          # A push deploys everywhere; a manual run can pick one server.
          WANTED: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          if [ "$WANTED" = all ]; then
            matrix="$(jq -c . <<<"$TARGETS")"
          else
            matrix="$(jq -c --arg n "$WANTED" '[.[] | select(.name == $n)]' <<<"$TARGETS")"
          fi
          if [ "$(jq length <<<"$matrix")" -eq 0 ]; then
            echo "error: no server named '$WANTED' in TARGETS" >&2
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "deploying to: $(jq -r '[.[].name] | join(", ")' <<<"$matrix")"

  deploy:
    needs: targets
    name: ${{ matrix.target.name }}
    # One server being unreachable must not stop the others getting the release.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}

    # The VM has no public IP, so GitHub cannot reach in over SSH. It runs a self
    # hosted runner that polls GitHub outbound, and this label is what routes the
    # job to it.
    runs-on: [self-hosted, "${{ matrix.target.runner }}"]
    timeout-minutes: 20

    # Never let two deploys touch the same directory at once. Queue them instead of
    # cancelling, so a superseded run still finishes cleanly rather than dying
    # halfway through a compose up. The group is per site, so a redeploy of best
    # does not wait on chemix having finished -- though with one runner for both,
    # the runner itself still runs them one after the other.
    concurrency:
      group: deploy-${{ matrix.target.name }}
      cancel-in-progress: false

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy
        env:
          TARGET_NAME: ${{ matrix.target.name }}
          DEPLOY_DIR: ${{ matrix.target.deploy_dir }}
          HEALTH_URL: ${{ matrix.target.health_url }}
          # Also set in each site's .env so manual docker compose and make
          # commands on the server hit the right stack. Passed here as well so a
          # deploy is correct even if someone edits that .env.
          COMPOSE_PROJECT_NAME: ${{ matrix.target.project }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
          GIT_TOKEN: ${{ github.token }}
        run: bash scripts/deploy.sh
