services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: werkgroep
      POSTGRES_USER: werkgroep
      POSTGRES_PASSWORD: werkgroep
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werkgroep -d werkgroep"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://werkgroep:werkgroep@db:5432/werkgroep?schema=public
      AUTH_SECRET: change-me-with-npx-auth-secret
      AUTH_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.org
      ADMIN_PASSWORD: change-me-before-deploy
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

volumes:
  postgres-data:
  uploads:
