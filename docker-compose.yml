services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: werkgroep
      POSTGRES_USER: werkgroep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werkgroep -d werkgroep"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # One host port per site. Several subdivisions share a server now, so they
    # cannot all take 3000: set APP_PORT in .env and point the proxy at it.
    ports:
      - "${APP_PORT:-3000}:3000"
    # Reads AUTH_SECRET, AUTH_URL, ADMIN_EMAIL, ADMIN_PASSWORD from .env.
    # format: raw passes values through literally, so a "$" in a password
    # survives. It also means quotes are NOT stripped -- write values
    # unquoted in .env (see .env.example).
    env_file:
      - path: .env
        format: raw
    # environment takes precedence over env_file, so these win over any
    # local-development values left in .env.
    environment:
      DATABASE_URL: postgresql://werkgroep:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/werkgroep?schema=public
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

volumes:
  postgres-data:
  uploads:
